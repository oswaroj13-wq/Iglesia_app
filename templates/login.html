{% extends "base.html" %}
{% block title %}Iniciar Sesión - IglesiaApp{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-6 px-4">
    <div class="animate__animated animate__zoomIn animate__faster bg-white/80 backdrop-blur-md p-8 rounded-2xl shadow-2xl border border-slate-200/60 w-full max-w-md relative overflow-hidden">
        
        <!-- Adorno superior en degradado -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600"></div>

        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-3 shadow-inner">
                <i class="fa-solid fa-church text-2xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Bienvenido</h2>
            <p class="text-sm text-slate-500 mt-1">Ingresa tus datos para acceder al sistema</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-5">
            <div>
                <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2">Usuario</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                    <input type="text" name="username" required 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-600 focus:bg-white transition duration-200" 
                           placeholder="Ej: admin">
                </div>
            </div>

            <div>
                <label class="block text-slate-700 text-xs font-bold uppercase tracking-wider mb-2">Contraseña</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                    <input type="password" name="password" required 
                           class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/40 focus:border-blue-600 focus:bg-white transition duration-200" 
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                    class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg shadow-blue-500/30 hover:shadow-blue-500/50 hover:scale-[1.01] active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2">
                <span>Entrar al Sistema</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
